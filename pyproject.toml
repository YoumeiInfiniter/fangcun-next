[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fangcun-next"
version = "0.3.6"
description = "Fangcun Next: novel-to-short-drama screenplay skill runtime (agent-agnostic)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
fangcun = "scripts.project_cli:main"

[tool.setuptools]
packages = ["scripts"]
